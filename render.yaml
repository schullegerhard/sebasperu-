# Render Blueprint — un solo servicio que sirve TODO en un dominio:
#   • Tienda (storefront SPA)      → /
#   • Panel de administración      → /admin
#   • API REST                     → /api/*
# La API (api/src/index.js) sirve el build de Vite (dist/) en el mismo origen,
# por eso el buildCommand compila el front ANTES de instalar la API.
#
# En Render:  New → Blueprint → conecta el repo → se crea el servicio.
# Luego, en el dashboard del servicio, define DATABASE_URL (tu URI de Supabase).
services:
  - type: web
    name: sebasperu
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm install --prefix api
    startCommand: node api/src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true        # Render genera un secreto seguro
      - key: DATABASE_URL
        sync: false                # pega tu URI de Supabase/Postgres en el dashboard
      # CORS no hace falta: tienda, admin y API comparten el mismo origen.

# (Opcional) Storefront Next.js para SEO — desplegar por separado cuando esté listo.
# Ver storefront/ y la sección "Opción SEO" de DEPLOY.md.
